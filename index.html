<!doctype html>
<html lang="en"><head>
<title>PPE Inventory</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PPE"><meta name="theme-color" content="#1c3578">
<style>
/* Layout: sticky command bar with data-file status, tab strip (Stock / Issue & receive / Stock count / Quarterly order), one working panel per tab */
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#152033; --muted:#5a6578; --line:#d5dbe4; --soft:#f6f8fb;
  --accent:#1c3578; --accent-ink:#ffffff; --accent-soft:#e3e9f8;
  --bad:#c00000; --bad-bg:#fde8e8; --warn:#9a6400; --warn-bg:#fff6c2; --good:#0b7a2e; --good-bg:#e3f5e8;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --panel:#171e2a; --ink:#e6ebf3; --muted:#9aa5b8; --line:#2b3546; --soft:#1c2533;
  --accent:#7c9bf0; --accent-ink:#0b1220; --accent-soft:#223056;
  --bad:#ff7b7b; --bad-bg:#4a1f22; --warn:#f0c060; --warn-bg:#4a4214; --good:#5fd07e; --good-bg:#183a24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141c; --panel:#171e2a; --ink:#e6ebf3; --muted:#9aa5b8; --line:#2b3546; --soft:#1c2533;
  --accent:#7c9bf0; --accent-ink:#0b1220; --accent-soft:#223056;
  --bad:#ff7b7b; --bad-bg:#4a1f22; --warn:#f0c060; --warn-bg:#4a4214; --good:#5fd07e; --good-bg:#183a24; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1400px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 220px}
.brand b{font-size:16px;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.brand span.dirty{color:var(--warn)}
@media (max-width:640px){.bar{position:static} .row{grid-template-columns:minmax(0,1fr)!important}}
.tabs{display:flex;gap:2px;overflow-x:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1400px;margin:0 auto}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:9px 14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.wrap{max-width:1400px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:600}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.hint{font-size:12px;color:var(--muted);margin:0}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px}
button:hover{border-color:var(--accent)}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;padding:9px 16px}
.primary:disabled{opacity:.6;cursor:progress}
.danger{color:var(--bad)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lang{display:flex}
.lang button{padding:6px 9px;font-size:12px;font-weight:600;color:var(--muted)}
.lang button:first-child{border-radius:6px 0 0 6px}
.lang button:last-child{border-radius:0 6px 6px 0;margin-left:-1px}
.lang button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-mono)}
/* summary tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left}
.kpi b{font-size:22px;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.bad b{color:var(--bad)} .kpi.warn b{color:var(--warn)}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;font-size:12px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.chip .ico{width:20px;height:20px;border-radius:50%}
/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--soft);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th.r,td.r{text-align:right}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--soft)}
tr.click{cursor:pointer}
tr.off td{opacity:.55}
td.namecell{min-width:240px}
.nm{display:flex;gap:10px;align-items:center;min-width:0}
.nm div{min-width:0}
.nm b{font-weight:600;display:block;overflow-wrap:anywhere}
.nm small{color:var(--muted);font-size:12px}
.ico{width:40px;height:40px;border-radius:6px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--soft)}
.ico img{width:100%;height:100%;object-fit:cover;display:block}
.ico svg{width:70%;height:70%}
.ico.big{width:120px;height:120px;border-radius:8px}
.pill{display:inline-block;min-width:34px;text-align:center;padding:2px 8px;border-radius:999px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:500}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--good-bg);color:var(--good)}
.order-q{font-weight:700;color:var(--accent)}
td input.q{width:80px;text-align:right;padding:4px 6px;font-family:var(--font-mono)}
td input.q.set{background:var(--accent-soft);border-color:var(--accent)}
/* type-ahead */
.ta{position:relative}
.ta-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:20;max-height:380px;overflow:auto;padding:4px}
.ta-opt{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}
.ta-opt[aria-selected="true"],.ta-opt:hover{background:var(--accent-soft)}
.ta-opt .nm{flex:1}
.ta-opt .rob{font-family:var(--font-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.ta-empty{padding:10px;color:var(--muted);font-size:13px}
mark{background:var(--warn-bg);color:inherit;border-radius:2px}
/* movement form */
.seg{display:flex;flex-wrap:wrap}
.seg button{border-radius:0;margin-left:-1px;font-weight:600}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.seg button:last-child{border-radius:0 6px 6px 0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.picked{display:flex;gap:14px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
.picked .nm b{font-size:15px}
.mv-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.mv-grid{grid-template-columns:minmax(0,1fr)}}
.log{display:flex;flex-direction:column}
.log-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.log-row .t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:4px}
.t-i{background:var(--bad-bg);color:var(--bad)} .t-r{background:var(--good-bg);color:var(--good)} .t-c{background:var(--accent-soft);color:var(--accent)}
.log-row small{color:var(--muted);display:block}
.x{border:0;background:transparent;color:var(--muted);padding:2px 6px}
.x:hover{color:var(--bad)}
/* count sheet */
tr.edited td{background:var(--accent-soft)}
.diff-neg{color:var(--bad)} .diff-pos{color:var(--good)}
.stickybar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:flex-end;gap:10px;align-items:center;pointer-events:none}
.stickybar>*{pointer-events:auto}
.stickybar .note{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,15,25,.55);z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(860px,100%);padding:18px;display:flex;flex-direction:column;gap:14px}
.dlg.small{width:min(440px,100%)}
.dlg-head{display:flex;gap:16px;align-items:flex-start}
.dlg-head .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.dlg-head h3{margin:0;font-size:18px;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stats div{background:var(--soft);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column}
.stats small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stats b{font-family:var(--font-mono);font-size:17px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font-mono)}
.chart .bar-r{fill:var(--accent)}
.chart .bar-r.in{fill:var(--accent)} .chart .bar-r.out{fill:var(--line)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .val{fill:var(--ink);font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:60;max-width:calc(100% - 32px);font-size:13px}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.sample{background:var(--warn-bg);border-radius:6px;padding:8px 12px;font-size:13px}
body.crewmode .tabs, body.crewmode #filestat, body.crewmode #openfile, body.crewmode #savefile, body.crewmode #xlsx, body.crewmode #ghsync{display:none}
#ghsync,#ghset{display:none} body.gh #ghsync, body.gh #ghset{display:inline-flex} body.crewmode #ghset, body.crewmode #ghsync{display:none!important}
.stepper{display:flex;gap:8px;align-items:center}
.stepper button{width:48px;height:48px;font-size:22px;font-weight:700;padding:0}
.stepper input{width:90px;height:48px;text-align:center;font-size:20px;font-family:var(--font-mono)}
.primary.big{padding:14px 18px;font-size:16px}
.crew .ta-list{max-height:60vh}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<header class="bar"><div class="bar-in">
  <div class="brand"><b data-t="Склад СИЗ (PPE)">Склад СИЗ (PPE)</b><span id="filestat">—</span></div>
  <div class="tools">
    <button id="ghsync" class="primary">Sync</button><button id="ghset" title="Sync settings" aria-label="Sync settings">⚙</button>
    <button id="openfile" data-t="Открыть файл данных">Открыть файл данных</button>
    <button id="savefile" class="primary" data-t="Сохранить файл данных">Сохранить файл данных</button>
    <button id="xlsx" data-t="Экспорт в Excel">Экспорт в Excel</button>
    
    <input type="file" id="fileinput" accept=".json,application/json" hidden>
  </div>
</div>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="stock" data-t="Склад">Склад</button>
  <button role="tab" data-tab="move" data-t="Выдача и приход">Выдача и приход</button>
  <button role="tab" data-tab="count" data-t="Инвентура">Инвентура</button>
  <button role="tab" data-tab="order" data-t="Заявка на квартал">Заявка на квартал</button>
</nav></header>

<div class="wrap" id="view"></div>
<input type="file" id="photoinput" accept="image/*" hidden>
<input type="file" id="photosinput" accept="image/*" multiple hidden>

  if(/shower|scanrain|arctic|scanjet|scanrix|winter|rain|parka|jacket/.test(n)) return "wear";
  return "other";
}

/* ---------- calculations ---------- */
let C = {};          // per item: {rob, used, monthly:{YYYY-MM:n}, lastCount, n}
let WIN = {start:"", end:"", months:3};
function addMonths(iso, m){ const d = new Date(iso+"T00:00:00Z"); const day = d.getUTCDate(); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth()+m); const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 0)).getUTCDate(); d.setUTCDate(Math.min(day,last)); return d.toISOString().slice(0,10); }
function calc(){
  const byItem = {};
  let maxD = "", maxAny = "";
  S.ev.forEach((e,n)=>{ (byItem[e.i] = byItem[e.i] || []).push([e,n]); if(e.t==="c" && e.d>maxD) maxD = e.d; if(e.d>maxAny) maxAny = e.d; });
  const months = +S.settings.months || 3;
  const end = S.settings.end || maxD || maxAny || today();
  const start = addMonths(end, -months);
  WIN = {start, end, months, lastCount:maxD};
  C = {};
  for(const it of S.items){
    // same day: events with a clock time (counts, issues, phone imports) go in real time order, so a phone issue taken before a count is not subtracted twice
    const list = (byItem[it.id]||[]).sort((a,b)=> a[0].d<b[0].d?-1 : a[0].d>b[0].d?1 : (a[0].at && b[0].at && a[0].at!==b[0].at) ? (a[0].at<b[0].at?-1:1) : a[1]-b[1]);
    let rob = null, used = 0, issued = 0, recv = 0; const monthly = {}; let lastCount = "";
    for(const [e] of list){
      let u = 0;
      if(e.t==="r"){ rob = (rob||0) + e.q; if(e.d>start && e.d<=end) recv += e.q; }
      else if(e.t==="i"){ rob = (rob||0) - e.q; u = e.q; if(e.d>start && e.d<=end) issued += e.q; }
      else if(e.t==="c"){ if(rob!==null && rob>e.q) u = rob - e.q; rob = e.q; lastCount = e.d; }
      if(u>0){ const m = e.d.slice(0,7); monthly[m] = (monthly[m]||0) + u; if(e.d>start && e.d<=end) used += u; }
    }
    const r = rob===null ? 0 : rob;
    const perMonth = used / months;
    const forecast = perMonth * 3;
    const need = Math.ceil(forecast * (1 + (+S.settings.safety||0)/100) - 1e-9) + (+it.min||0);
    const sug = Math.max(0, need - Math.max(0,r) - (+it.awaiting||0));
    C[it.id] = {rob:r, used, perMonth, forecast, sug, monthly, lastCount, issued, recv, known: rob!==null};
  }
}
const fmt = n => (Math.round(n*10)/10).toLocaleString(LANG==="en"?"en-GB":"ru-RU");
const fdate = iso => iso ? iso.slice(8,10)+"."+iso.slice(5,7)+"."+iso.slice(0,4) : "—";
function finalQty(id){ const o = S.override[id]; return (o!==undefined && o!==null && o!=="") ? +o : C[id].sug; }
function robClass(it){ const c = C[it.id]; if(c.rob<=0) return "bad"; if((+it.min||0)>0 && c.rob<+it.min) return "warn"; if(c.perMonth>0 && c.rob<c.perMonth) return "warn"; return "ok"; }

/* ---------- search ---------- */
function hay(it){ const c = CAT[it.cat]||CAT.other; return (it.name+" "+c.ru+" "+c.en+" "+c.kw+" "+(it.loc||"")).toLowerCase(); }
function search(q, opts){
  opts = opts || {};
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean);
  let list = S.items.filter(it=> (opts.archived || it.active!==false) && (!opts.cat || it.cat===opts.cat));
  if(!toks.length) return list;
  const scored = [];
  for(const it of list){
    const h = hay(it), n = it.name.toLowerCase();
    let s = 0, ok = true;
    for(const t of toks){
      if(!h.includes(t)){ ok = false; break; }
      if(n.startsWith(t)) s += 3; else if(new RegExp("(^|[\\s\\-/(])"+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(n)) s += 2; else if(n.includes(t)) s += 1;
    }
    if(ok) scored.push([s,it]);
  }
  scored.sort((a,b)=>b[0]-a[0]);
  return scored.map(x=>x[1]);
}
function hl(name, q){
  let out = esc(name);
  const toks = q.toLowerCase().split(/\s+/).filter(t=>t.length>0);
  for(const t of toks){ const i = out.toLowerCase().indexOf(esc(t).toLowerCase()); if(i>=0){ const tt = esc(t); out = out.slice(0,i)+"<mark>"+out.slice(i,i+tt.length)+"</mark>"+out.slice(i+tt.length); } }
  return out;
}
const itemById = id => S.items.find(i=>i.id===id);

/* ---------- type-ahead picker ---------- */
function typeahead(input, onPick){
  const box = document.createElement("div"); box.className = "ta-list"; box.hidden = true; box.setAttribute("role","listbox");
  input.parentNode.appendChild(box);
  input.setAttribute("autocomplete","off"); input.setAttribute("role","combobox");
  let res = [], sel = 0;
  const draw = ()=>{
    const q = input.value.trim();
    res = search(q).slice(0,40);
    if(!res.length){ box.innerHTML = `<div class="ta-empty">${L("Ничего не найдено.")}</div>`; box.hidden = false; return; }
    box.innerHTML = res.map((it,k)=>`<div class="ta-opt" role="option" data-k="${k}" aria-selected="${k===sel}">${`<span class="nm">${iconHTML(it)}<div><b>${hl(it.name,q)}</b><small>${esc(catName(it.cat))} · ${esc(it.loc)}</small></div></span>`}<span class="rob">${L("остаток")} ${fmt(C[it.id].rob)} ${esc(it.unit)}</span></div>`).join("");
    box.hidden = false;
  };
  input.addEventListener("input", ()=>{ sel = 0; draw(); });
  input.addEventListener("focus", ()=>{ sel = 0; draw(); });
  input.addEventListener("keydown", e=>{
    if(box.hidden) return;
    if(e.key==="ArrowDown"){ sel = Math.min(res.length-1, sel+1); e.preventDefault(); mark(); }
    else if(e.key==="ArrowUp"){ sel = Math.max(0, sel-1); e.preventDefault(); mark(); }
    else if(e.key==="Enter"){ if(res[sel]){ e.preventDefault(); pick(res[sel]); } }
    else if(e.key==="Escape"){ box.hidden = true; }
  });
  const mark = ()=>{ box.querySelectorAll(".ta-opt").forEach((o,k)=>{ o.setAttribute("aria-selected", k===sel); if(k===sel) o.scrollIntoView({block:"nearest"}); }); };
  box.addEventListener("mousedown", e=>{ const o = e.target.closest(".ta-opt"); if(o){ e.preventDefault(); pick(res[+o.dataset.k]); } });
  input.addEventListener("blur", ()=>setTimeout(()=>{ box.hidden = true; }, 150));
  const pick = it=>{ box.hidden = true; onPick(it); };
}

function modal(html, cls){
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="dlg ${cls||""}" role="dialog" aria-modal="true">${html}</div>`;
  m.addEventListener("mousedown", e=>{ if(e.target===m) close(); });
  const close = ()=>{ m.remove(); document.removeEventListener("keydown", key); };
  const key = e=>{ if(e.key==="Escape") close(); };
  document.addEventListener("keydown", key);
  document.body.appendChild(m);
  return {el:m, close};
}
function ask(title, text, okText){

function chartSVG(it){
  const c = C[it.id]; const months = [];
  let m = WIN.end.slice(0,7);
  for(let k=0;k<12;k++){ months.unshift(m); const [y,mm] = m.split("-").map(Number); const d = new Date(Date.UTC(y,mm-2,1)); m = d.toISOString().slice(0,7); }
  const vals = months.map(x=>c.monthly[x]||0); const max = Math.max(1,...vals);
  const W = 600, H = 170, pl = 8, pb = 22, pt = 16, bw = (W-pl*2)/12;
  const ws = WIN.start.slice(0,7), we = WIN.end.slice(0,7);
  const bars = months.map((x,k)=>{ const h = (vals[k]/max)*(H-pb-pt); const xx = pl+k*bw+bw*0.15; const inw = x>ws && x<=we || x===we;
    return `<rect class="bar-r ${inw?"in":"out"}" x="${xx.toFixed(1)}" y="${(H-pb-h).toFixed(1)}" width="${(bw*0.7).toFixed(1)}" height="${h.toFixed(1)}" rx="2"></rect>`+
      (vals[k]?`<text class="val" x="${(xx+bw*0.35).toFixed(1)}" y="${(H-pb-h-4).toFixed(1)}" text-anchor="middle">${fmt(vals[k])}</text>`:"")+
      `<text x="${(xx+bw*0.35).toFixed(1)}" y="${H-6}" text-anchor="middle">${x.slice(5)}.${x.slice(2,4)}</text>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(L("Расход по месяцам"))}"><line class="grid" x1="${pl}" x2="${W-pl}" y1="${H-pb}" y2="${H-pb}"></line>${bars}</svg>`;
}

/* ---------- photos ---------- */
function shrink(file, side){
  side = side || 240;
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = ()=>{ const k = Math.min(1, side/Math.max(img.width, img.height)); const cv = document.createElement("canvas"); cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
      const g = cv.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0,0,cv.width,cv.height); g.drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg",0.82)); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("image")); };
    img.src = url;
  });
}
const SIZE_TOK = /^(xs|s|m|l|xl|xxl|2xl|3xl|4xl|\d+\/?[a-z]*|eur|size|one|pc|pair)$/;
const toks = s => s.toLowerCase().replace(/\.[a-z0-9]+$/,"").replace(/[_\-()/.,]+/g," ").split(/\s+/).filter(t=>t && !SIZE_TOK.test(t));
$("photosinput").onchange = async e=>{
  const files = [...e.target.files]; e.target.value = ""; if(!files.length) return;
  let matched = 0, miss = [];
  for(const f of files){
    const ft = toks(f.name); if(!ft.length){ miss.push(f.name); continue; }
    // every word of the file name must appear in the item name; item gets the photo from the file whose name covers most of its words
    const hits = S.items.filter(it=>{ const nt = toks(it.name); return ft.every(t=>nt.some(x=>x===t || (t.length>3 && x.startsWith(t)))); });
    if(!hits.length){ miss.push(f.name); continue; }
    let data; try{ data = await shrink(f); }catch(err){ miss.push(f.name); continue; }
    for(const it of hits){ const sc = ft.length / toks(it.name).length; if(!it._ps || sc>=it._ps){ it.photo = data; it._ps = sc; it.u = new Date().toISOString(); } }
    matched++;
  }
  S.items.forEach(it=>delete it._ps);
  touch(); render();
  toast(L("Назначено фото")+": "+matched+(miss.length?", "+L("не распознано")+": "+miss.length+" ("+miss.slice(0,3).join(", ")+(miss.length>3?"…":"")+")":"")+". "+(matched?"":L("Подсказка: назовите файлы фото как позиции (например «ScanBlade.jpg» или «Boiler Suit Blue.jpg»), и приложение само подберёт их ко всем размерам.")));
};

/* ---------- saving files ---------- */
let downloads = null, fileHandle = null;
async function saveBlob(blob, name, types){
  // 1) direct file write (Chrome/Edge opened from the stick): lets "Save" overwrite the same data file
  if(window.showSaveFilePicker && window.self===window.top){
    try{
      let h = (types==="json" && fileHandle) ? fileHandle : null;
      if(!h) h = await showSaveFilePicker({suggestedName:name, types: types && types.startsWith("json") ? [{description:"PPE data", accept:{"application/json":[".json"]}}] : [{description:"Excel", accept:{"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":[".xlsx"]}}]});
      const w = await h.createWritable(); await w.write(blob); await w.close();
      if(types==="json") fileHandle = h;
      return h.name || name;
    }catch(err){ if(err && err.name==="AbortError") throw {code:"declined"}; }
  }
  // 2) claude.ai viewer
  if(!downloads && window.claude && claude.use){ try{ downloads = await claude.use("downloads"); }catch(e){} }
  if(downloads){ await downloads.save({filename:name, data:blob}); return name; }
  if(window.claude) throw {code:"unavailable"};
  // 3) phones (iPhone home-screen app): the share sheet saves to Files or sends by AirDrop / WhatsApp / mail
  if(navigator.canShare && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){
    const file = new File([blob], name, {type:blob.type||"application/octet-stream"});
    if(navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file], title:name}); return name; }catch(err){ if(err && err.name==="AbortError") throw {code:"declined"}; } }
  }
  // 4) plain browser download
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  return name;
}
function saveErr(err){ const c = err && err.code; toast(c==="declined" ? L("Сохранение отменено.") : c==="unavailable" ? L("Сохранение файлов недоступно в этом окне.") : L("Не получилось")+": "+(err && (err.message||err.code) || err)); }

async function ghSync(quiet){
  const c = ghCfg(); if(!c){ ghSetup(); return; }
  if(ghBusy){ return; } ghBusy = true;
  const btn = $("ghsync"); btn.disabled = true; btn.textContent = "Syncing…";
  const url = `https://api.github.com/repos/${c.repo}/contents/${encodeURIComponent(c.path||"PPE data.json")}`;
  const h = {Authorization:"Bearer "+c.token, Accept:"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28"};
  try{
    let got = 0, sent = false;
    for(let attempt=0; ; attempt++){
      let sha, remote = null;
      const r = await fetch(url+"?ref=main&t="+Date.now(), {headers:h, cache:"no-store"});
      if(r.status===200){
        const j = await r.json(); sha = j.sha;
        let txt = j.content && j.encoding==="base64" ? b64dec(j.content) : null;
        if(txt===null){ const rr = await fetch(url+"?ref=main&t="+Date.now(), {headers:Object.assign({}, h, {Accept:"application/vnd.github.raw+json"}), cache:"no-store"}); txt = await rr.text(); }
        try{ remote = JSON.parse(txt); }catch(e){}
        if(!remote || remote.kind!=="ppe-inventory") throw new Error("The file in GitHub is not a PPE data file.");
      } else if(r.status===401) throw new Error("GitHub refused the token. It may be mistyped or expired: open Sync settings (⚙) and paste a new one.");
      else if(r.status===404){
        const rr = await fetch(`https://api.github.com/repos/${c.repo}`, {headers:h, cache:"no-store"});
        if(rr.status!==200) throw new Error(`Repository ${c.repo} not found, or the token has no access to it.`);
      } else if(r.status===403 || r.status===429) throw new Error("GitHub says too many requests or no permission. Check that the token has Contents: Read and write.");
      else throw new Error("GitHub error "+r.status);
      if(remote){ const before = JSON.stringify([S.settings, S.override]); const m = mergeState(remote); got = m.ev + m.items + m.del + (JSON.stringify([S.settings, S.override])!==before?1:0); if(got){ S.meta.changed = new Date().toISOString(); calc(); persist(); render(); } }
      const body = syncBody(), txt = JSON.stringify(body);
      const same = remote && ghSig(remote) === ghSig(body);
      if(!same){
        const put = await fetch(url, {method:"PUT", headers:h, body:JSON.stringify({message:"Sync from "+(/iPhone|iPad|Android/.test(navigator.userAgent)?"phone":"PC")+" "+new Date().toISOString().slice(0,16).replace("T"," "), content:b64enc(txt), sha, branch:"main"})});
        if(put.status===409 || put.status===422){ if(attempt<3) continue; throw new Error("Another device was syncing at the same moment. Press Sync again."); }
        if(put.status===401) throw new Error("GitHub refused the token. Open Sync settings and paste a new one.");
        if(put.status===403 || put.status===404) throw new Error("The token can read but not write. Give it Contents: Read and write.");
        if(!put.ok) throw new Error("GitHub error "+put.status+" while uploading.");
        sent = true;
      }
      break;
    }
    const at = new Date().toISOString(); lsSet("ppe-gh", Object.assign(ghCfg(), {at}));
    if(S.meta.changed <= at) { S.meta.saved = at; S.meta.file = "GitHub"; persist(); }
    if(!quiet || got) toast(got ? `Synced with GitHub: ${got} change${got===1?"":"s"} from the other device${sent?", your changes uploaded":""}.` : sent ? "Synced with GitHub: your changes uploaded." : "Synced with GitHub: already up to date.");
  }catch(err){
    const offline = err instanceof TypeError || !navigator.onLine;
    if(!quiet || !offline) toast(offline ? "No internet. Your changes are kept on this device; press Sync when you are online." : err.message);
  }
  ghBusy = false; btn.disabled = false; btn.textContent = "Sync"; fileStatus();
}

/* merge another device's data: events are kept by id (never overwritten), items by newest edit, deletions travel as tombstones */
function mergeState(st){
  const r = {ev:0, items:0, del:0};
  S.meta.removed = S.meta.removed || []; S.meta.removedItems = S.meta.removedItems || [];
  const remEv = new Set(S.meta.removed.concat(st.meta && st.meta.removed || []));
  const remIt = new Set(S.meta.removedItems.concat(st.meta && st.meta.removedItems || []));
  S.meta.removed = [...remEv]; S.meta.removedItems = [...remIt];
  for(const inc of st.items){
    if(remIt.has(inc.id)) continue;
    const loc = itemById(inc.id);
    if(!loc){ S.items.push(Object.assign({}, inc)); r.items++; }
    else if((inc.u||"") > (loc.u||"")){ const ph = loc.photo; Object.assign(loc, inc); if(!inc.photo) loc.photo = ph; r.items++; }
  }
  const have = new Set(S.ev.map(e=>String(e.id)));
  for(const e of st.ev){ const id = String(e.id); if(!have.has(id) && !remEv.has(id) && !remIt.has(e.i)){ S.ev.push(e); have.add(id); r.ev++; } }
  const before = S.ev.length + S.items.length;
  S.ev = S.ev.filter(e=>!remEv.has(String(e.id)) && !remIt.has(e.i)); S.items = S.items.filter(i=>!remIt.has(i.id));
  r.del = before - S.ev.length - S.items.length;
  const rs = st.meta && (st.meta.setAt || st.meta.changed) || "";
  if(rs > (S.meta.setAt||"")){ S.settings = Object.assign({}, S.settings, st.settings||{}); S.override = Object.assign({}, st.override||{}); S.meta.setAt = rs; r.set = true; }
  addSeedPhotos(S);
  return r;
}
function fileStatus(){
  const el = $("filestat");
  const dirty = !S.meta.saved || S.meta.changed > S.meta.saved;
  el.classList.toggle("dirty", dirty);
  const t = s => { const d = new Date(s); return fdate(d.toISOString().slice(0,10))+" "+d.toTimeString().slice(0,5); };
  el.textContent = (S.meta.file ? S.meta.file+" · " : "") + (dirty ? L("Не сохранено в файл с ")+t(S.meta.saved||S.meta.created) : L("Все изменения сохранены в файл"));
  if(S.meta.file==="GitHub"){ el.textContent = dirty ? "Changes not synced yet (last sync "+t(S.meta.saved)+")" : "Synced with GitHub "+t(S.meta.saved); el.classList.toggle("dirty", dirty); }

}

function colName(n){ let s = ""; n++; while(n){ const m = (n-1)%26; s = String.fromCharCode(65+m)+s; n = Math.floor((n-1)/26); } return s; }
const xmlEsc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,"");

function sheetXML(rows, widths, opt){

    if(typeof v==="number") return `<c r="${ref}" s="${s}"><v>${v}</v></c>`;

function importIssues(list, src){

    if(have.has(id) || gone.has(id)) continue;
    let it = itemById(x.i) || S.items.find(i=>i.name===x.name);
    if(!it){ it = {id:"n"+uid(), name:x.name||"?", cat:guessCat(x.name||""), loc:"", unit:x.unit||"Pc", min:0, awaiting:0, ordered:0, photo:null, active:true}; S.items.push(it); }
    S.ev.push({id, t:"i", d:x.d, i:it.id, q:+x.q, at:x.at, n:[L("С телефона")+": "+(x.who||"?"), x.n].filter(Boolean).join(" · ")});
    have.add(id); n++;
  }
  if(n){ touch(); render(); toast(L("Получено выдач с телефона")+": "+n+(src?" ("+src+")":"")); }
  return n;
}
function forgetX(id){ if(String(id).startsWith("x")){ S.meta.removedX = (S.meta.removedX||[]).concat(String(id)); if(cloud && MODE==="owner") cloud.doc("data/issues/log/"+String(id).slice(1)).delete().catch(()=>{}); } }

/* owner: the whole data lives in data/sync, so every device that opens this link as the owner shares it.
   events: one doc per month {e:{id:event}}; items: one doc {it:{id:item without photo}}; own photos: one doc per item; meta: tombstones + settings */
let R = null, syncT = 0, pushing = false, syncState = "off";
function startSync(){
  R = {ev:{}, it:{}, ph:{}, removed:{}, removedItems:{}, settings:null, override:null, setAt:"", ready:{ev:false, it:false, ph:false, meta:false}};
  const fail = ()=>{ syncState = "error"; fileStatus(); };
  cloud.collection("data/sync/ev").onSnapshot(snap=>{ R.ev = {}; snap.docs.forEach(d=>{ const e = (d.data()||{}).e||{}; for(const k in e) R.ev[k] = e[k]; }); R.ready.ev = true; pull(); }, fail);
  cloud.doc("data/sync/items/all").onSnapshot(d=>{ R.it = d.exists ? (d.data().it||{}) : {}; R.ready.it = true; pull(); }, fail);
  cloud.collection("data/sync/photos").onSnapshot(snap=>{ R.ph = {}; snap.docs.forEach(d=>{ R.ph[d.id] = (d.data()||{}).p||null; }); R.ready.ph = true; pull(); }, fail);
  cloud.doc("data/sync/meta/main").onSnapshot(d=>{ const m = d.exists ? d.data() : {}; R.removed = m.removed||{}; R.removedItems = m.removedItems||{}; R.settings = m.settings||null; R.override = m.override||null; R.setAt = m.setAt||""; R.ready.meta = true; pull(); }, fail);
}
const syncReady = ()=>R && R.ready.ev && R.ready.it && R.ready.ph && R.ready.meta;
function pull(){
  if(!syncReady()) return;
  syncState = "on";
  const st = {items: Object.values(R.it).map(i=>Object.assign({}, i, {photo:R.ph[i.id]||null})), ev: Object.values(R.ev),
    settings: R.settings||{}, override: R.override||{}, meta:{removed:Object.keys(R.removed), removedItems:Object.keys(R.removedItems), setAt:R.settings ? R.setAt : ""}};
  const r = mergeState(st);
  if(r.ev || r.items || r.del || r.set){ S.meta.changed = new Date().toISOString(); calc(); persist(); render(); publishCatalog(); }
  fileStatus(); schedulePush();
}
function schedulePush(){ if(!R) return; clearTimeout(syncT); syncT = setTimeout(push, 1500); }
const bare = it => { const o = Object.assign({}, it); delete o.photo; delete o._ps; return o; };
async function syncWrite(path, data){
  const ref = cloud.doc(path);
  try{ await ref.update(data); }catch(e){ if(e && e.code==="invalid_argument") await ref.set(data); else throw e; }
}
async function push(){
  if(!syncReady() || MODE!=="owner") return;
  if(pushing){ schedulePush(); return; }
  pushing = true;
  try{
    const rem = {}, remI = {};
    (S.meta.removed||[]).forEach(id=>{ if(!R.removed[id]) rem[id] = 1; });
    (S.meta.removedItems||[]).forEach(id=>{ if(!R.removedItems[id]) remI[id] = 1; });
    const meta = {};
    if(Object.keys(rem).length) meta.removed = rem;
    if(Object.keys(remI).length) meta.removedItems = remI;
    if((S.meta.setAt||"") > (R.setAt||"")){ meta.settings = S.settings; meta.override = S.override; meta.setAt = S.meta.setAt; }
    if(Object.keys(meta).length){ if(meta.override) await cloud.doc("data/sync/meta/main").set(Object.assign({removed:Object.assign({}, R.removed, rem), removedItems:Object.assign({}, R.removedItems, remI)}, meta)); else await syncWrite("data/sync/meta/main", meta); }
    const months = {};
    for(const e of S.ev){ const id = String(e.id); if(!R.ev[id]){ const m = (e.d||"0000-00").slice(0,7); (months[m] = months[m]||{})[id] = e; } }
    for(const m in months) await syncWrite("data/sync/ev/"+m, {e:months[m]});
    const its = {};
    for(const it of S.items){ const ri = R.it[it.id]; if(!ri || (it.u||"") > (ri.u||"")){ its[it.id] = bare(it);
      if(it.photo && it.photo!==PHOTOS[it.name] && it.photo!==R.ph[it.id]) try{ await cloud.doc("data/sync/photos/"+it.id).set({p:it.photo}); }catch(e){} } }
    if(Object.keys(its).length) await syncWrite("data/sync/items/all", {it:its});
    syncState = "on";
  }catch(e){ syncState = "error"; }
  pushing = false; fileStatus();
}
window.addEventListener("online", ()=>schedulePush());

/* owner: publish a small catalog (names, units, ROB) the phones search in */
let lastCat = "", catT = 0;
function catalogBody(){
  let room = 180000;
  const items = S.items.filter(i=>i.active!==false).map(it=>{
    const o = {id:it.id, name:it.name, unit:it.unit, cat:it.cat, loc:it.loc, rob:Math.max(0, C[it.id] ? C[it.id].rob : 0)};
    if(it.photo && it.photo!==PHOTOS[it.name] && it.photo.length<room){ o.photo = it.photo; room -= it.photo.length; }
    return o; });
  return {items};
}
function publishCatalog(){
  if(MODE!=="owner" || !cloud) return;
  clearTimeout(catT);
  catT = setTimeout(async ()=>{
    const body = catalogBody(); const s = JSON.stringify(body);
    if(s===lastCat) return;
    try{ await cloud.doc("data/catalog").set(Object.assign(body, {at:new Date().toISOString()})); lastCat = s; }catch(e){}
  }, 2500);
}

async function initCloud(){
  if(!(window.claude && claude.use)) { if(location.hash==="#crew") lsSet("ppe-mode","crew"); if(lsGet("ppe-mode","")==="crew"){ MODE = "crew"; applyMode(); catalog = lsGet("ppe-catalog", null); crewCatalog(); render(); } return; }
  try{ [cuser, cloud] = await Promise.all([claude.use("user"), claude.use("db")]); }catch(e){}
  if(!cuser || !cloud){ cloud = null; return; }
  MODE = cuser.isOwner() ? "owner" : "crew";
  try{ myId = await cuser.id(); const me = await cuser.me(); myName = (me && me.name) || ""; }catch(e){}
  applyMode();
  cloud.collection("data/issues/log").onSnapshot(snap=>{
    cloudState = "on";
    cloudLog = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    if(MODE==="owner") importIssues(cloudLog);
    else { const sent = new Set(cloudLog.map(x=>x.id)); let ch = false; queue.forEach(q=>{ if(!q.sent && sent.has(q.id)){ q.sent = true; ch = true; } }); if(ch) lsSet(XQ, queue); render(); }
  }, ()=>{ cloudState = "error"; render(); });
  if(MODE==="owner"){
    try{ const c = await cloud.doc("data/catalog").get(); if(c.exists){ const b = Object.assign({}, c.data()); delete b.at; lastCat = JSON.stringify(b); } }catch(e){}
    publishCatalog(); startSync();
  } else {
    cloud.doc("data/catalog").onSnapshot(s=>{ catalog = s.exists ? s.data() : null; crewCatalog(); render(); }, ()=>{});
    flushQueue();
  }
  render();
}
function applyMode(){ document.body.classList.toggle("crewmode", MODE==="crew"); }

/* crew: stock list from the owner's catalog (online) or the local data (offline file) */
function crewCatalog(){
  if(!catalog || !Array.isArray(catalog.items)) return;
  S = Object.assign(fromSeed(), {items: catalog.items.map(i=>Object.assign({min:0, awaiting:0, ordered:0, active:true}, i, {photo:i.photo||PHOTOS[i.name]||null})), ev:[]});
  C = {};
  const after = cloud ? cloudLog.filter(x=>x.at > (catalog.at||"")).concat(queue.filter(q=>!q.sent)) : queue.filter(q=>q.at > (catalog.at||""));
  for(const it of S.items){ const p = after.filter(x=>x.i===it.id).reduce((a,x)=>a+(+x.q||0),0); C[it.id] = {rob:Math.max(0,it.rob-p), used:0, perMonth:0, forecast:0, sug:0, monthly:{}, lastCount:"", known:true}; }
}
async function flushQueue(){
  if(!cloud || MODE!=="crew") return;
  for(const q of queue.filter(q=>!q.sent)){
    try{ await cloud.doc("data/issues/log/"+q.id).set({i:q.i, name:q.name, unit:q.unit, q:q.q, d:q.d, n:q.n, who:q.who, by:myId||"", at:q.at}); q.sent = true; lsSet(XQ, queue); }
    catch(e){ if(e && e.code==="invalid_argument"){ toast(L("Нет прав на запись. Попросите владельца пригласить вас по email с уровнем «Редактор».")); } break; }
  }
  render();
}
window.addEventListener("online", ()=>flushQueue());

let crewItem = null, crewQty = 1;
function renderCrew(v){
  const it = crewItem ? itemById(crewItem) : null;
  const mine = queue.slice().reverse().slice(0,30);
  const unsent = queue.filter(q=>!q.sent).length;
  const noCat = cloud && !catalog;
  v.innerHTML = `<div class="panel crew">
      <h2>${L("Взять со склада")}</h2>
      ${!cloud && catalog ? `<p class="hint">${L("Пакет склада от")} ${fdate(catalog.at.slice(0,10))}</p>` : ""}${!cloud && !catalog ? `<p class="sample">${L("Загрузите пакет склада, который прислал владелец: кнопка внизу экрана.")}</p>` : ""}
      ${noCat ? `<p class="sample">${L("Склад ещё не открыт владельцем онлайн. Список позиций появится после того, как он откроет эту страницу.")}</p>` : ""}
      <label>${L("Ваше имя")}<input id="cwho" value="${esc(crewName())}" ${myName?"disabled":""}></label>
      <label>${L("Что берёте")}<div class="ta"><input id="cq2" placeholder="${esc(L("Начните вводить название…"))}"></div></label>
      ${it ? `<div class="picked">${iconHTML(it,true)}<div class="nm"><div><b>${esc(it.name)}</b><small>${esc(catName(it.cat))} · ${esc(it.loc)}</small><div style="margin-top:6px">${L("Сейчас на складе")}: <span class="pill ${C[it.id].rob<=0?"bad":"ok"}">${fmt(C[it.id].rob)}</span> ${esc(it.unit)}</div></div></div></div>
        <div class="stepper"><button id="cminus" aria-label="−">−</button><input id="cqty" type="number" min="1" step="1" inputmode="numeric" value="${crewQty}"><button id="cplus" aria-label="+">+</button><span>${esc(it.unit)}</span></div>
        <label>${L("Комментарий")}<input id="cnote2" placeholder="${esc(L("например, для покраски на палубе"))}"></label>
        <button class="primary big" id="ctake">${L("Записать, что взял")}</button>` : ""}
    </div>
    <div class="panel">
      <div class="tools" style="justify-content:space-between"><h2>${L("Мои записи")}</h2>
        <span class="hint">${cloud ? (cloudState==="error" ? L("Нет связи. Записи отправятся, когда появится интернет.") : unsent ? unsent+" "+L("ждут отправки") : L("Всё отправлено")) : L("Без интернета: отправьте файл выдач владельцу.")}</span></div>
      <div class="log">${mine.length ? mine.map(q=>`<div class="log-row"><span class="t ${q.sent?"t-r":"t-i"}">${q.sent?L("Отправлено"):q.exported?L("В файле"):L("Не отправлено")}</span><div><b>${esc(q.name)}</b><small>${fdate(q.d)}${q.n?" · "+esc(q.n):""}</small></div><span class="num">${fmt(q.q)} ${esc(q.unit||"")}</span>${q.sent?"<span></span>":`<button class="x" data-cdel="${q.id}" aria-label="${L("Удалить")}">✕</button>`}</div>`).join("") : `<p class="hint">${L("Пока нет записей.")}</p>`}</div>
      <div class="tools">${unsent && cloud ? `<button id="cflush">${L("Отправить сейчас")}</button>` : ""}<button id="cfile">${L("Сохранить файл выдач")}</button>${!cloud ? `<button id="cpkg">${L("Загрузить пакет склада")}</button><input type="file" id="cpkgf" accept=".json,application/json" hidden>` : ""}${!cloud ? `<button id="cexit">${L("Выйти из режима работника")}</button>` : ""}</div>
    </div>`;
  const who = $("cwho"); if(!myName) who.onchange = ()=>lsSet("ppe-crew-name", who.value.trim());
  typeahead($("cq2"), p=>{ crewItem = p.id; crewQty = 1; renderCrew(v); });
  if(it){
    $("cminus").onclick = ()=>{ crewQty = Math.max(1, (+$("cqty").value||1)-1); $("cqty").value = crewQty; };
    $("cplus").onclick = ()=>{ crewQty = (+$("cqty").value||0)+1; $("cqty").value = crewQty; };
    $("ctake").onclick = ()=>{
      const q = +$("cqty").value; const name = (myName || $("cwho").value.trim());
      if(!name) return toast(L("Впишите своё имя."));
      if(!(q>0)) return toast(L("Введите количество больше нуля."));
      lsSet("ppe-crew-name", name);
      queue.push({id:uid(), i:it.id, name:it.name, unit:it.unit, q, d:today(), n:$("cnote2").value.trim(), who:name, at:new Date().toISOString(), sent:false});
      lsSet(XQ, queue); toast(L("Записано")+": "+it.name+" — "+fmt(q));
      crewItem = null; crewCatalog(); renderCrew(v); flushQueue();
    };
  }
  v.querySelectorAll("[data-cdel]").forEach(b=>b.onclick = ()=>{ queue = queue.filter(q=>q.id!==b.dataset.cdel); lsSet(XQ, queue); crewCatalog(); renderCrew(v); });
  const fl = $("cflush"); if(fl) fl.onclick = flushQueue;
  $("cfile").onclick = async ()=>{
    const list = queue.filter(q=>!q.sent);
    if(!list.length) return toast(L("Нет неотправленных записей."));
    try{
      const name = await saveBlob(new Blob([JSON.stringify({kind:"ppe-issues", who:crewName(), made:new Date().toISOString(), issues:list})], {type:"application/json"}), "PPE issues "+(crewName()||"crew").replace(/[^\w\- ]+/g,"")+" "+stamp()+".json", "json-x");
      list.forEach(q=>q.exported = true); lsSet(XQ, queue); renderCrew(v); toast(L("Файл сохранён. Отправьте его владельцу склада")+": "+name);
    }catch(err){ saveErr(err); }
  };
  const pk = $("cpkg"); if(pk){ pk.onclick = ()=>{ $("cpkgf").value = ""; $("cpkgf").click(); };
    $("cpkgf").onchange = async e=>{ const f = e.target.files[0]; if(!f) return; try{ const j = JSON.parse(await f.text()); if(j.kind!=="ppe-catalog" || !Array.isArray(j.items)) throw 0;
      catalog = j; lsSet("ppe-catalog", j); crewCatalog(); renderCrew(v); toast(L("Пакет склада загружен")+": "+fdate(j.at.slice(0,10))); }catch(err){ toast(L("Файл не похож на пакет склада.")); } }; }
  const ex = $("cexit"); if(ex) ex.onclick = ()=>{ lsSet("ppe-mode",""); MODE = "owner"; applyMode(); location.reload(); };
}

/* owner: crew panel on the Issue & receive tab */
function crewPanelHTML(){
  const fromPhone = S.ev.filter(e=>String(e.id).startsWith("x")).length;
  return `<div class="panel">
    <h2>${L("Выдачи с телефонов работников")}</h2>
    ${cloud ? `<p class="hint">${L("Синхронизация включена. Работник открывает эту же страницу на телефоне и видит только экран «Взять со склада». Дайте ему доступ: меню «Поделиться» → пригласить по email с уровнем «Редактор». Нужен его аккаунт claude.ai.")}</p>`
            : `<p class="hint">${L("Обмен файлами без интернета: сохраните «пакет склада» и отправьте работнику (AirDrop, WhatsApp, почта, флешка). Он загружает его в своём приложении в «Режиме работника», записывает выдачи и присылает вам «файл выдач». Вы загружаете его кнопкой «Импорт выдач», повторы не задваиваются.")}</p>`}
    <p class="hint">${L("Получено с телефонов")}: ${fromPhone}</p>
    <div class="tools"><button id="ximport">${L("Импорт выдач из файла")}</button><button id="xpkg">${L("Сохранить пакет склада для работника")}</button>${cloud?"":`<button id="xcrew">${L("Включить режим работника на этом устройстве")}</button>`}</div>
    <input type="file" id="xfile" accept=".json,application/json" multiple hidden>
  </div>`;
}
function bindCrewPanel(){
  $("ximport").onclick = ()=>{ $("xfile").value = ""; $("xfile").click(); };
  $("xfile").onchange = async e=>{
    let total = 0, bad = 0;
    for(const f of e.target.files){ try{ const j = JSON.parse(await f.text()); if(j.kind!=="ppe-issues" || !Array.isArray(j.issues)) { bad++; continue; } total += importIssues(j.issues.map(x=>Object.assign({who:j.who}, x)), f.name); }catch(err){ bad++; } }
    if(!total) toast(bad ? L("Файл не похож на файл выдач PPE.") : L("Новых выдач в файле нет, всё уже учтено."));
  };
  $("xpkg").onclick = async ()=>{ try{ const name = await saveBlob(new Blob([JSON.stringify(Object.assign({kind:"ppe-catalog", at:new Date().toISOString()}, catalogBody()))], {type:"application/json"}), "PPE store package "+stamp()+".json", "json-p"); toast(L("Пакет сохранён. Отправьте его работнику")+": "+name); }catch(err){ saveErr(err); } };
  const c = $("xcrew"); if(c) c.onclick = async ()=>{ if(await ask(L("Включить режим работника?"), L("На этом устройстве будет только экран «Взять со склада». Используйте это на телефоне или компьютере работника. Выйти можно кнопкой внизу экрана."), L("Включить"))){ lsSet("ppe-mode","crew"); MODE = "crew"; applyMode(); render(); } };
}

/* ---------- misc ---------- */
let toastT = 0;
function toast(msg){ let t = document.querySelector(".toast"); if(!t){ t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); document.body.appendChild(t); } t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(()=>t.remove(), 5000); }
function applyStatic(){ document.documentElement.lang = LANG; document.querySelectorAll("[data-t]").forEach(el=>el.textContent = L(el.dataset.t)); document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===LANG)); document.title = L("Склад СИЗ (PPE)"); }
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick = ()=>{ LANG = b.dataset.lang; try{ localStorage.setItem("ppe-lang", LANG); }catch(e){} applyStatic(); calc(); fileStatus(); render(); });
document.querySelectorAll(".tabs button").forEach(b=>b.onclick = ()=>{ tab = b.dataset.tab; try{ localStorage.setItem("ppe-tab", tab); }catch(e){} render(); });
try{ tab = localStorage.getItem("ppe-tab") || "stock"; }catch(e){}
window.addEventListener("beforeunload", e=>{ if(S && (!S.meta.saved || S.meta.changed > S.meta.saved) && S.meta.edited){ e.preventDefault(); e.returnValue = ""; } });

(async ()=>{
  S = fromSeed(); calc(); applyStatic(); fileStatus(); render();
  if(window.claude && claude.use) claude.use("downloads").then(d=>{ downloads = d; }).catch(()=>{});
  idb = await openDB();
  const raw = await idbGet("state");
  if(raw){ try{ const st = JSON.parse(raw); if(st && st.kind==="ppe-inventory"){ addSeedPhotos(st); S = st; S.settings = Object.assign({months:3,end:"",safety:20}, S.settings||{}); S.override = S.override||{}; } }catch(e){} }
  if(MODE==="crew" && !cloud){ /* offline crew keeps using the local list */ }
  calc(); fileStatus(); render();
  initCloud();
  if(!(window.claude && claude.use)){ document.body.classList.add("gh"); if(ghCfg() && ghCfg().auto!==false && MODE==="owner") setTimeout(()=>ghSync(true), 1500); }
})();
</script>
