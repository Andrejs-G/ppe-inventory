<!doctype html>
<html lang="en"><head>
<title>Paint Inventory</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Paint"><meta name="theme-color" content="#1c3578">
<style>
/* Layout: sticky command bar (data file, export, white/dark switch), tab strip, one working panel per tab */
:root{
  --bg:#ffffff; --panel:#ffffff; --ink:#152033; --muted:#5a6578; --line:#d9dee6; --soft:#f5f7fa;
  --accent:#1c3578; --accent-ink:#ffffff; --accent-soft:#e3e9f8;
  --bad:#c00000; --bad-bg:#fde8e8; --warn:#9a6400; --warn-bg:#fff6c2; --good:#0b7a2e; --good-bg:#e3f5e8;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f141c; --panel:#171e2a; --ink:#e6ebf3; --muted:#9aa5b8; --line:#2b3546; --soft:#1c2533;
  --accent:#7c9bf0; --accent-ink:#0b1220; --accent-soft:#223056;
  --bad:#ff7b7b; --bad-bg:#4a1f22; --warn:#f0c060; --warn-bg:#4a4214; --good:#5fd07e; --good-bg:#183a24; color-scheme:dark}
@media (prefers-color-scheme: dark){:root[data-theme="auto"]{
  --bg:#0f141c; --panel:#171e2a; --ink:#e6ebf3; --muted:#9aa5b8; --line:#2b3546; --soft:#1c2533;
  --accent:#7c9bf0; --accent-ink:#0b1220; --accent-soft:#223056;
  --bad:#ff7b7b; --bad-bg:#4a1f22; --warn:#f0c060; --warn-bg:#4a4214; --good:#5fd07e; --good-bg:#183a24; color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 220px}
.brand b{font-size:16px;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.brand span.dirty{color:var(--warn)}
@media (max-width:640px){.bar{position:static} .row{grid-template-columns:minmax(0,1fr)!important}}
.tabs{display:flex;gap:2px;overflow-x:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:9px 14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.wrap{max-width:1440px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:600}
h3{margin:0}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
label.inline{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13px}
label.inline input{width:auto}
input,select,textarea{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.hint{font-size:12px;color:var(--muted);margin:0}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px}
button:hover{border-color:var(--accent)}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;padding:9px 16px}
.primary:disabled{opacity:.6;cursor:progress}
.danger{color:var(--bad)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;flex-wrap:wrap}
.seg button{border-radius:0;margin-left:-1px;font-weight:600}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.seg button:last-child{border-radius:0 6px 6px 0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg.small button{padding:5px 9px;font-size:12px}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-mono)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left}
.kpi b{font-size:22px;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.bad b{color:var(--bad)} .kpi.warn b{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--muted);margin:1px 3px 1px 0;white-space:nowrap}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--soft);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th[data-s]{cursor:pointer}
th.r,td.r{text-align:right}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--soft)}
tr.click{cursor:pointer}
tr.off td{opacity:.55}
tr.sec td{background:var(--soft);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.namecell{min-width:230px}
.nm b{font-weight:600;display:block;overflow-wrap:anywhere}
.nm small{color:var(--muted);font-size:12px}
.sw{display:inline-block;width:18px;height:18px;border-radius:4px;border:1px solid rgba(0,0,0,.25);vertical-align:middle;flex:0 0 auto}
.ral{display:inline-flex;gap:6px;align-items:center;white-space:nowrap;font-family:var(--font-mono);font-size:12px}
.ral.approx{color:var(--muted);font-style:italic}
.pill{display:inline-block;white-space:nowrap;min-width:34px;text-align:center;padding:2px 8px;border-radius:999px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:500}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--good-bg);color:var(--good)}
.order-q{font-weight:700;color:var(--accent)}
td input.q{width:84px;text-align:right;padding:4px 6px;font-family:var(--font-mono)}
td input.q.set{background:var(--accent-soft);border-color:var(--accent)}
.ta{position:relative}
.ta-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:20;max-height:380px;overflow:auto;padding:4px}
.ta-opt{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}
.ta-opt[aria-selected="true"],.ta-opt:hover{background:var(--accent-soft)}
.ta-opt .nm{flex:1;min-width:0}
.ta-opt .rob{font-family:var(--font-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.ta-empty{padding:10px;color:var(--muted);font-size:13px}
mark{background:var(--warn-bg);color:inherit;border-radius:2px}
.picked{display:flex;gap:14px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
.mv-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.mv-grid{grid-template-columns:minmax(0,1fr)}}
.log-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.log-row .t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:4px}
.t-i{background:var(--bad-bg);color:var(--bad)} .t-r{background:var(--good-bg);color:var(--good)} .t-c{background:var(--accent-soft);color:var(--accent)}
.log-row small{color:var(--muted);display:block}
.x{border:0;background:transparent;color:var(--muted);padding:2px 6px}
.x:hover{color:var(--bad)}
tr.edited td{background:var(--accent-soft)}
.diff-neg{color:var(--bad)} .diff-pos{color:var(--good)}
.stickybar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:flex-end;gap:10px;align-items:center;pointer-events:none}
.stickybar>*{pointer-events:auto}
.stickybar .note{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(10,15,25,.55);z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(920px,100%);padding:18px;display:flex;flex-direction:column;gap:14px}
.dlg.small{width:min(460px,100%)}
.dlg-head{display:flex;gap:16px;align-items:flex-start}
.dlg-head .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.dlg-head h3{font-size:18px;overflow-wrap:anywhere}
.big-sw{width:72px;height:72px;border-radius:8px;border:1px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-align:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stats div{background:var(--soft);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column}
.stats small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stats b{font-family:var(--font-mono);font-size:17px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px 12px;max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--soft)}
.checks label{flex-direction:row;align-items:flex-start;gap:6px;color:var(--ink);font-size:12px;font-weight:400}
.checks input{width:auto;margin-top:2px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font-mono)}
.chart .bar-r.in{fill:var(--accent)} .chart .bar-r.out{fill:var(--line)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .val{fill:var(--ink);font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:60;max-width:calc(100% - 32px);font-size:13px}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.sample{background:var(--warn-bg);border-radius:6px;padding:8px 12px;font-size:13px}
/* paint chart */
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:14px}
.area h3{font-size:15px}
.area .meta{font-size:12px;color:var(--muted)}
.coat td{font-size:12px}
.stockcell{display:flex;flex-direction:column;gap:3px}
.stocklink{display:flex;gap:6px;align-items:center;justify-content:space-between;border:0;background:transparent;padding:0;text-align:left;font-size:12px;color:var(--ink)}
.stocklink:hover{text-decoration:underline}
.none{color:var(--bad);font-size:12px;font-weight:600}
/* colours */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.ccard{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);text-align:left;padding:0;display:flex;flex-direction:column}
.ccard .c{height:46px}
.ccard .l{padding:5px 7px;font-size:11px;line-height:1.3}
.ccard .l b{font-family:var(--font-mono);font-size:12px;display:block}
.ccard.used{outline:2px solid var(--accent)}
.ccard .u{font-size:10px;color:var(--accent);font-weight:600}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000;background:#fff;font-size:9pt}
  #print table{font-size:8pt} #print th{position:static;background:#eee;color:#000} #print td,#print th{padding:2px 4px;border:1px solid #bbb}
  #print h1{font-size:14pt;margin:0 0 4px} #print p{margin:0 0 8px}
  #print .sw{border:1px solid #888}
  @page{size:A4 landscape;margin:10mm}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<header class="bar"><div class="bar-in">
  <div class="brand"><b>Paint Inventory</b><span id="filestat">—</span></div>
  <div class="tools">
    <button id="openfile">Open data file</button>
    <button id="savefile" class="primary">Save data file</button>
    <button id="xlsx">Export to Excel</button>
    <button id="pdf">Print / PDF</button>
    <div class="seg small" role="group" aria-label="Background">
      <button data-theme="light">White</button><button data-theme="dark">Dark</button>
    </div>
    <input type="file" id="fileinput" accept=".json,application/json" hidden>
  </div>
</div>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="stock">Stock</button>
  <button role="tab" data-tab="move">Use &amp; receive</button>
  <button role="tab" data-tab="count">Stock count</button>
  <button role="tab" data-tab="order">Order</button>
  <button role="tab" data-tab="chart">Paint chart</button>
  <button role="tab" data-tab="ral">RAL colours</button>
</nav></header>

<div class="wrap" id="view"></div>
<div id="print"></div>

function fromSeed(){
  const st = blank();
  if(SEED){
    st.items = SEED.items.map(i=>Object.assign({min:0, awaiting:0}, i));
    st.ev = SEED.events.map((e,n)=>({id:"s"+n, t:e[0], d:e[1], i:e[2], q:e[3]}));

  }

}

/* ---------- paint chart links ---------- */
const AREAS = () => (S.chart && S.chart.areas) || [];
const areaById = id => AREAS().find(a=>a.id===id);
const family = it => it.name.toLowerCase().split(/\s+/).slice(0,2).join(" ").replace(/\s+(eca|pha|ena)\S*$/,"");
function codesIn(a){ return new Set(a.coats.map(c=>c[0]).concat(a.markings||[])); }
function thinnersIn(a){ const P = S.chart.products; const s = new Set(); a.coats.map(c=>c[0]).concat(a.markings||[]).forEach(c=>{ (P[c] && P[c].thinner || "").split(/,\s*/).forEach(t=>t && s.add(t)); }); return s; }
let WU = {};   // item id -> [area ids]
function linkChart(){
  WU = {};
  if(!S.chart){ return; }
  const A = AREAS();
  for(const it of S.items){
    const spec = it.spec||[];
    let ids = [];
    if(it.sec==="thinner") ids = A.filter(a=>{ const t = thinnersIn(a); return spec.some(c=>t.has(c)); }).map(a=>a.id);
    else if(it.sec!=="hardener") ids = A.filter(a=>{ const c = codesIn(a); return spec.some(x=>c.has(x)); }).map(a=>a.id);
    if(it.areas && it.areas.length) ids = it.sec==="hardener" || !spec.length ? it.areas.slice() : ids.filter(x=>it.areas.includes(x));
    WU[it.id] = ids;
  }
  // a hardener is used wherever its base paint is used
  for(const it of S.items) if(it.sec==="hardener" && !(it.areas && it.areas.length)){
    const f = family(it); const s = new Set();
    S.items.filter(p=>p.sec==="paint" && p.active!==false && family(p).startsWith(f)).forEach(p=>(WU[p.id]||[]).forEach(x=>s.add(x)));
    WU[it.id] = A.map(a=>a.id).filter(x=>s.has(x));
  }
}
function stockFor(area, code){ return S.items.filter(it=>it.active!==false && (it.spec||[]).includes(code) && (WU[it.id]||[]).includes(area.id)); }
function thinnerStock(code){ return S.items.filter(it=>it.active!==false && it.sec==="thinner" && (it.spec||[]).includes(code)); }

/* ---------- calculations ---------- */
let C = {};
let WIN = {start:"", end:"", months:6};
function addMonths(iso, m){ const d = new Date(iso+"T00:00:00Z"); const day = d.getUTCDate(); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth()+m); const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 0)).getUTCDate(); d.setUTCDate(Math.min(day,last)); return d.toISOString().slice(0,10); }
function countDates(){ return [...new Set(S.ev.filter(e=>e.t==="c").map(e=>e.d))].sort(); }
function calc(){
  const byItem = {};
  let maxD = "", maxAny = "";
  S.ev.forEach((e,n)=>{ (byItem[e.i] = byItem[e.i] || []).push([e,n]); if(e.t==="c" && e.d>maxD) maxD = e.d; if(e.d>maxAny) maxAny = e.d; });
  const months = +S.settings.months || 6, cover = +S.settings.cover || 3;
  const end = S.settings.end || maxD || maxAny || today();
  const start = addMonths(end, -months);
  const cd = countDates(); const prevCount = cd.filter(d=>d<maxD).pop() || "";
  WIN = {start, end, months, cover, lastCount:maxD, prevCount};
  C = {};
  for(const it of S.items){
    // same-day order: receipts, then use, then the count (a count records what is left at the end of that day)
    const rank = {r:0, i:1, c:2};
    const list = (byItem[it.id]||[]).sort((a,b)=> a[0].d<b[0].d?-1 : a[0].d>b[0].d?1 : (a[0].at && b[0].at && a[0].at!==b[0].at) ? (a[0].at<b[0].at?-1:1) : (rank[a[0].t]-rank[b[0].t]) || a[1]-b[1]);
    let rob = null, used = 0, recv = 0, pUsed = 0, pRecv = 0; const monthly = {}; let lastCount = "";
    for(const [e] of list){
      let u = 0;
      const inP = e.d>prevCount && e.d<=maxD;
      if(e.t==="r"){ rob = (rob||0) + e.q; if(e.d>start && e.d<=end) recv += e.q; if(inP) pRecv += e.q; }
      else if(e.t==="i"){ rob = (rob||0) - e.q; u = e.q; }
      else if(e.t==="c"){ if(rob!==null && rob>e.q) u = rob - e.q; rob = e.q; lastCount = e.d; }
      if(u>0){ const m = e.d.slice(0,7); monthly[m] = (monthly[m]||0) + u; if(e.d>start && e.d<=end) used += u; if(inP) pUsed += u; }
    }
    const r = rob===null ? 0 : Math.max(0, rob);
    const perMonth = used / months;
    const forecast = perMonth * cover;
    const needL = forecast * (1 + (+S.settings.safety||0)/100) + (+it.min||0);
    const sugL = Math.max(0, needL - r - (+it.awaiting||0));
    const cap = +it.cap||0;
    const sug = sugL<=0.01 ? 0 : cap ? Math.ceil(sugL/cap - 1e-9) : Math.ceil(sugL);
    C[it.id] = {rob:r, used, recv, perMonth, forecast, sugL, sug, monthly, lastCount, pUsed, pRecv, known: rob!==null};
  }
  linkChart();
}

function finalQty(id){ const o = S.override[id]; return (o!==undefined && o!==null && o!=="") ? +o : C[id].sug; }
const unitOrder = it => (+it.cap>0) ? "can" : "L";
function robClass(it){ const c = C[it.id]; if(c.rob<=0) return "bad"; if((+it.min||0)>0 && c.rob<+it.min) return "warn"; if(c.perMonth>0 && c.rob<c.perMonth) return "warn"; return "ok"; }
function expiry(it){ if(!it.mfg || !(+it.shelf>0)) return null; return addMonths(it.mfg, +it.shelf); }
function expClass(it){ const x = expiry(it); if(!x) return ""; if(x<=today()) return "bad"; if(x<=addMonths(today(),3)) return "warn"; return "ok"; }
const fullName = it => it.name + (it.colour ? " – "+it.colour : "");

/* ---------- RAL ---------- */
function ralHTML(it, opts){
  if(!it.ral) return opts && opts.blank!==undefined ? opts.blank : `<span class="hint">—</span>`;
  const hex = RALHEX[it.ral];
  return `<span class="ral ${it.ralOk?"":"approx"}" title="${esc((it.ralOk?"":"Suggested, check against the colour card. ")+(RALNAME[it.ral]||""))}">${hex?`<span class="sw" style="background:${hex}"></span>`:""}${it.ralOk?"":"≈ "}RAL ${esc(it.ral)}</span>`;
}

/* ---------- search ---------- */
function hay(it){ return [it.name, it.colour, it.code, it.maker, it.cat, it.usage, it.note, SECNAME[it.sec], it.ral?"ral "+it.ral+" "+it.ral:"", RALNAME[it.ral]||"", (WU[it.id]||[]).map(a=>{ const x = areaById(a); return x ? x.short+" "+x.name : ""; }).join(" "), (it.spec||[]).join(" ")].join(" ").toLowerCase(); }
function search(q, opts){
  opts = opts || {};
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean);
  let list = S.items.filter(it=> (opts.archived || it.active!==false) && (!opts.sec || it.sec===opts.sec) && (!opts.maker || (it.maker||"Other")===opts.maker));
  if(!toks.length) return list;
  const scored = [];
  for(const it of list){
    const h = hay(it), n = fullName(it).toLowerCase();
    let s = 0, ok = true;
    for(const t of toks){
      if(!h.includes(t)){ ok = false; break; }
      if(n.startsWith(t)) s += 3; else if(new RegExp("(^|[\\s\\-/(])"+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(n)) s += 2; else if(n.includes(t)) s += 1;
    }
    if(ok) scored.push([s,it]);
  }
  scored.sort((a,b)=>b[0]-a[0]);
  return scored.map(x=>x[1]);
}
function hl(name, q){
  let out = esc(name);
  const toks = q.toLowerCase().split(/\s+/).filter(t=>t.length>0);
  for(const t of toks){ const i = out.toLowerCase().indexOf(esc(t).toLowerCase()); if(i>=0){ const tt = esc(t); out = out.slice(0,i)+"<mark>"+out.slice(i,i+tt.length)+"</mark>"+out.slice(i+tt.length); } }
  return out;
}
const itemById = id => S.items.find(i=>i.id===id);
function nameHTML(it, q){ return `<div class="nm"><b>${hl(fullName(it), q||"")}</b><small>${esc([it.maker, SECNAME[it.sec], it.code].filter(Boolean).join(" · "))}</small></div>`; }

/* ---------- type-ahead picker ---------- */
function typeahead(input, onPick){
  const box = document.createElement("div"); box.className = "ta-list"; box.hidden = true; box.setAttribute("role","listbox");
  input.parentNode.appendChild(box);
  input.setAttribute("autocomplete","off"); input.setAttribute("role","combobox");
  let res = [], sel = 0;
  const draw = ()=>{
    const q = input.value.trim();
    res = search(q).slice(0,40);
    if(!res.length){ box.innerHTML = `<div class="ta-empty">Nothing found.</div>`; box.hidden = false; return; }
    box.innerHTML = res.map((it,k)=>`<div class="ta-opt" role="option" data-k="${k}" aria-selected="${k===sel}">${it.ral && RALHEX[it.ral]?`<span class="sw" style="background:${RALHEX[it.ral]}"></span>`:`<span class="sw" style="background:transparent;border-style:dashed"></span>`}<span class="nm"><b>${hl(fullName(it),q)}</b><small>${esc([it.maker, SECNAME[it.sec], it.code].filter(Boolean).join(" · "))}</small></span><span class="rob">ROB ${fmt(C[it.id].rob)} L</span></div>`).join("");
    box.hidden = false;
  };
  input.addEventListener("input", ()=>{ sel = 0; draw(); });
  input.addEventListener("focus", ()=>{ sel = 0; draw(); });
  input.addEventListener("keydown", e=>{
    if(box.hidden) return;
    if(e.key==="ArrowDown"){ sel = Math.min(res.length-1, sel+1); e.preventDefault(); mark(); }
    else if(e.key==="ArrowUp"){ sel = Math.max(0, sel-1); e.preventDefault(); mark(); }
    else if(e.key==="Enter"){ if(res[sel]){ e.preventDefault(); pick(res[sel]); } }
    else if(e.key==="Escape"){ box.hidden = true; }
  });
  const mark = ()=>{ box.querySelectorAll(".ta-opt").forEach((o,k)=>{ o.setAttribute("aria-selected", k===sel); if(k===sel) o.scrollIntoView({block:"nearest"}); }); };
  box.addEventListener("mousedown", e=>{ const o = e.target.closest(".ta-opt"); if(o){ e.preventDefault(); pick(res[+o.dataset.k]); } });
  input.addEventListener("blur", ()=>setTimeout(()=>{ box.hidden = true; }, 150));
  const pick = it=>{ box.hidden = true; onPick(it); };
}

}

/* ---------- dialogs ---------- */
function modal(html, cls){
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="dlg ${cls||""}" role="dialog" aria-modal="true">${html}</div>`;
  m.addEventListener("mousedown", e=>{ if(e.target===m) close(); });
  const close = ()=>{ m.remove(); document.removeEventListener("keydown", key); };
  const key = e=>{ if(e.key==="Escape") close(); };
  document.addEventListener("keydown", key);
  document.body.appendChild(m);
  return {el:m, close};
}
function ask(title, text, okText){
  return new Promise(res=>{
    const d = modal(`<h3>${esc(title)}</h3><p style="margin:0">${esc(text)}</p><div class="tools" style="justify-content:flex-end"><button data-a="0">Cancel</button><button class="primary" data-a="1">${esc(okText)}</button></div>`, "small");
    d.el.querySelectorAll("[data-a]").forEach(b=>b.onclick = ()=>{ d.close(); res(b.dataset.a==="1"); });
  });
}
function choose(title, text, buttons){
  return new Promise(res=>{
    const d = modal(`<h3>${esc(title)}</h3><p style="margin:0">${esc(text)}</p><div class="tools" style="justify-content:flex-end">${buttons.map((b,k)=>`<button data-a="${k}" class="${b.primary?"primary":""}">${esc(b.label)}</button>`).join("")}</div>`, "small");
    d.el.querySelectorAll("[data-a]").forEach(b=>b.onclick = ()=>{ d.close(); res(buttons[+b.dataset.a].value); });
  });
}
function lastMonths(n){ const months = []; let m = (WIN.lastCount||today()).slice(0,7); for(let k=0;k<n;k++){ months.unshift(m); const [y,mm] = m.split("-").map(Number); m = new Date(Date.UTC(y,mm-2,1)).toISOString().slice(0,7); } return months; }
function chartSVG(it){
  const c = C[it.id]; const months = lastMonths(12);
  const vals = months.map(x=>c.monthly[x]||0); const max = Math.max(1,...vals);
  const W = 600, H = 170, pl = 8, pb = 22, pt = 16, bw = (W-pl*2)/12;
  const ws = WIN.start.slice(0,7), we = WIN.end.slice(0,7);
  const bars = months.map((x,k)=>{ const h = (vals[k]/max)*(H-pb-pt); const xx = pl+k*bw+bw*0.15; const inw = x>ws && x<=we;
    return `<rect class="bar-r ${inw?"in":"out"}" x="${xx.toFixed(1)}" y="${(H-pb-h).toFixed(1)}" width="${(bw*0.7).toFixed(1)}" height="${h.toFixed(1)}" rx="2"></rect>`+
      (vals[k]?`<text class="val" x="${(xx+bw*0.35).toFixed(1)}" y="${(H-pb-h-4).toFixed(1)}" text-anchor="middle">${fmt(vals[k])}</text>`:"")+
      `<text x="${(xx+bw*0.35).toFixed(1)}" y="${H-6}" text-anchor="middle">${x.slice(5)}.${x.slice(2,4)}</text>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Litres used per month"><line class="grid" x1="${pl}" x2="${W-pl}" y1="${H-pb}" y2="${H-pb}"></line>${bars}</svg>`;
}
function openItem(id){

}

/* ---------- saving files ---------- */
let downloads = null, fileHandle = null;
async function saveBlob(blob, name, types){
  // 1) direct file write (Chrome/Edge opened from the stick): lets "Save" overwrite the same data file
  if(window.showSaveFilePicker && window.self===window.top){
    try{
      let h = (types==="json" && fileHandle) ? fileHandle : null;
      if(!h) h = await showSaveFilePicker({suggestedName:name, types: types==="json" ? [{description:"Paint data", accept:{"application/json":[".json"]}}] : [{description:"Excel", accept:{"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":[".xlsx"]}}]});
      const w = await h.createWritable(); await w.write(blob); await w.close();
      if(types==="json") fileHandle = h;
      return h.name || name;
    }catch(err){ if(err && err.name==="AbortError") throw {code:"declined"}; }
  }
  // 2) claude.ai viewer
  if(!downloads && window.claude && claude.use){ try{ downloads = await claude.use("downloads"); }catch(e){} }
  if(downloads){ await downloads.save({filename:name, data:blob}); return name; }
  if(window.claude) throw {code:"unavailable"};
  // 3) phones (iPhone home-screen app): the share sheet saves to Files or sends by AirDrop / WhatsApp / mail
  if(navigator.canShare && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){
    const file = new File([blob], name, {type:blob.type||"application/octet-stream"});
    if(navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file], title:name}); return name; }catch(err){ if(err && err.name==="AbortError") throw {code:"declined"}; } }
  }
  // 4) plain browser download
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  return name;
}

async function loadText(txt, name){
  let st; try{ st = JSON.parse(txt); }catch(e){ st = null; }
  if(!st || st.kind!=="paint-inventory" || !Array.isArray(st.items) || !Array.isArray(st.ev)) return toast("This file is not a Paint data file.");
  if(S.items.length){
    const how = await choose("Sync with this file?", "Merge adds the changes made on the other device (stock counts, use, receipts, new items) to the data here and keeps everything already here. Replace throws away the data here and uses only the file.",
      [{label:"Cancel", value:""}, {label:"Replace", value:"replace"}, {label:"Merge (recommended)", value:"merge", primary:true}]);
    if(!how) return;
    if(how==="merge"){ const r = mergeState(st); touch(); render(); toast(`Merged ${name}: ${r.ev} new records, ${r.items} items added or updated${r.del?", "+r.del+" deleted":""}.`); return; }
  }
  st = fixState(st); st.meta = Object.assign({}, st.meta, {file:name, changed:st.meta.saved||new Date().toISOString()});
  S = st; calc(); persist(); fileStatus(); render(); toast("Data loaded from file: "+name);
}
/* merge another device's data: records are kept by id (never overwritten), items by newest edit, deletions travel as tombstones */
function mergeState(st){
  const r = {ev:0, items:0, del:0};
  S.meta.removed = S.meta.removed || []; S.meta.removedItems = S.meta.removedItems || [];
  const remEv = new Set(S.meta.removed.concat(st.meta && st.meta.removed || []));
  const remIt = new Set(S.meta.removedItems.concat(st.meta && st.meta.removedItems || []));
  S.meta.removed = [...remEv]; S.meta.removedItems = [...remIt];
  for(const inc of st.items){
    if(remIt.has(inc.id)) continue;
    const loc = itemById(inc.id);
    if(!loc){ S.items.push(Object.assign({}, inc)); r.items++; }
    else if((inc.u||"") > (loc.u||"")){ Object.assign(loc, inc); r.items++; }
  }
  const have = new Set(S.ev.map(e=>String(e.id)));
  for(const e of st.ev){ const id = String(e.id); if(!have.has(id) && !remEv.has(id) && !remIt.has(e.i)){ S.ev.push(e); have.add(id); r.ev++; } }
  const before = S.ev.length + S.items.length;
  S.ev = S.ev.filter(e=>!remEv.has(String(e.id)) && !remIt.has(e.i)); S.items = S.items.filter(i=>!remIt.has(i.id));
  r.del = before - S.ev.length - S.items.length;
  const rs = st.meta && (st.meta.setAt || st.meta.changed) || "";
  if(rs > (S.meta.setAt||"")){ S.settings = Object.assign({}, S.settings, st.settings||{}); S.override = Object.assign({}, st.override||{}); S.meta.setAt = rs; }
  if(!S.chart && st.chart) S.chart = st.chart;
  return r;
}
function fileStatus(){
  const el = $("filestat");
  const dirty = !S.meta.saved || S.meta.changed > S.meta.saved;
  el.classList.toggle("dirty", dirty);
  const t = s => { const d = new Date(s); return fdate(d.toISOString().slice(0,10))+" "+d.toTimeString().slice(0,5); };
  el.textContent = (S.meta.file ? S.meta.file+" · " : "") + (dirty ? "Not saved to file since "+t(S.meta.saved||S.meta.created) : "All changes saved to file");
}

function colName(n){ let s = ""; n++; while(n){ const m = (n-1)%26; s = String.fromCharCode(65+m)+s; n = Math.floor((n-1)/26); } return s; }
const xmlEsc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,"");
function serial(iso){ return (Date.UTC(+iso.slice(0,4), +iso.slice(5,7)-1, +iso.slice(8,10)) - Date.UTC(1899,11,30)) / 86400000; }
// cell: value or {v, s}; styles: 0 normal, 1 header, 2 date, 3 bold highlight, 4 title, 5 bold, 6 section row, 7 number 0.0, 8 wrap text
function sheetXML(rows, widths, opt){
  opt = opt || {};
  const out = rows.map((r,ri)=>`<row r="${ri+1}">`+r.map((c,ci)=>{
    if(c===null || c===undefined || c==="") return "";
    let v = c, s = 0; if(typeof c==="object"){ v = c.v; s = c.s||0; if(v===null||v===undefined||v==="") return s?`<c r="${colName(ci)}${ri+1}" s="${s}"/>`:""; }
    const ref = colName(ci)+(ri+1);
    if(s===2 && typeof v==="string") return `<c r="${ref}" s="2"><v>${serial(v)}</v></c>`;
    if(typeof v==="number"){ if(!s && Math.round(v)!==v) s = 7; return `<c r="${ref}" s="${s}"><v>${Math.round(v*1000)/1000}</v></c>`; }
    return `<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
  }).join("")+`</row>`).join("");
  const hr = opt.headerRow || 1;
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><sheetViews><sheetView workbookViewId="0"><pane ${opt.freezeCol?`xSplit="${opt.freezeCol}" `:""}ySplit="${hr}" topLeftCell="${opt.freezeCol?colName(opt.freezeCol):"A"}${hr+1}" activePane="${opt.freezeCol?"bottomRight":"bottomLeft"}" state="frozen"/></sheetView></sheetViews><cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${out}</sheetData>${opt.filter?`<autoFilter ref="A${hr}:${colName(widths.length-1)}${rows.length}"/>`:""}<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/><pageSetup paperSize="9" orientation="landscape" fitToWidth="1" fitToHeight="0"/></worksheet>`;
}

/><xf numFmtId="0" fontId="2" fillId="4" borderId="1" applyFont="1" applyFill="1" applyBorder="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="1" applyNumberFormat="1" applyBorder="1"/><xf numFmtId="0" fontId="0" fillId="0" borderId="1" applyBorder="1" applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
async function buildXlsx(sheets){

  z.file("xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView/></bookViews><sheets>${sheets.map((s,i)=>`<sheet name="${xmlEsc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets><definedNames>${sheets.map((s,i)=>s.filter?`<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${xmlEsc(s.name)}'!$A$${s.headerRow||1}:$${colName(s.widths.length-1)}$${s.rows.length}</definedName>`:"").join("")}</definedNames></workbook>`);
